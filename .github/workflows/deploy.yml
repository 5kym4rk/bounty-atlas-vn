name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Deploy chi chay khi du lieu hop le. Validator la cong chan cuoi cung.
      - name: Kiem tra du lieu kien thuc
        run: npm run validate:data

      - name: Build
        run: npm run build
        env:
          # Doi thanh '/' neu deploy len custom domain hoac user/org site.
          BASE_PATH: /bounty-atlas-vn/

      # HashRouter khong can rewrite, nhung 404.html giup truong hop nguoi dung
      # vao mot duong dan khong ton tai van tai duoc ung dung.
      - name: Tao 404.html
        run: cp dist/index.html dist/404.html

      - name: Chan Jekyll xu ly thu muc bat dau bang gach duoi
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
